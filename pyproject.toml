[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lismore-da-mcp"
version = "0.1.0"
description = "MCP server for Lismore Development Application assistance"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # See requirements.txt: <2 because mcp 2.0 renames Tool.inputSchema.
    "mcp>=1.0.0,<2",
    "pymupdf>=1.24.0",
    "starlette>=0.37.0",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
# Only used by the standalone fetch_*.py scraping scripts, never imported by the server
# itself — kept out of the deployed image so it doesn't ship Playwright's browser binaries.
scraping = [
    "httpx>=0.27.0",
    "playwright>=1.40.0",
]

# Test-only. Not installed on Render (requirements.txt is the deploy manifest).
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"

[project.scripts]
lismore-da-mcp = "lismore_da_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lismore_da_mcp"]
