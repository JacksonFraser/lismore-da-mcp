[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lismore-da-mcp"
version = "0.1.0"
description = "MCP server for Lismore Development Application assistance"
readme = "README.md"
# 3.14 everywhere: Render is pinned to it, CI tests it, the local .venv runs it.
# Declaring a lower floor than CI exercises is a claim of support nothing checks.
requires-python = ">=3.14"
dependencies = [
    # See requirements.txt for why this is held to one major.
    "mcp>=2.0.0,<3",
    "pymupdf>=1.24.0",
    "starlette>=0.37.0",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
# Only used by the standalone scripts/fetch_*.py scrapers, never imported by the server
# itself — kept out of the deployed image so it doesn't ship Playwright's browser binaries.
scraping = [
    "httpx>=0.27.0",
    "playwright>=1.40.0",
]

# Test-only. Not installed on Render (requirements.txt is the deploy manifest).
dev = [
    "pytest>=8.0.0",
    "pyright>=1.1.400",
    "ruff>=0.12.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"

[project.scripts]
lismore-da-mcp = "lismore_da_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lismore_da_mcp"]

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C901", "RUF013"]
# Long prose strings and verbatim quotes from planning instruments are the norm
# in data/, and wrapping them would make them harder to diff against the source.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# One-off audit CLIs whose main() is a linear report; splitting it buys nothing.
"scripts/*" = ["C901"]

[tool.ruff.lint.mccabe]
# A ceiling, not a target: stops any function growing past the current worst.
max-complexity = 20

[tool.ruff.lint.isort]
known-first-party = ["lismore_da_mcp"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.14"
typeCheckingMode = "basic"
