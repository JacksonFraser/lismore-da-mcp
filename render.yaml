# ⚠️ This file does NOT drive the live service. Editing it changes nothing.
#
# srv-d9jibcb7uimc739lnv60 was created manually in the Render dashboard rather
# than from this Blueprint, so its build and start commands come from the
# dashboard. Verified 2026-07-28: the index build step below was added here,
# the deploy reported "live", and it never ran — the server went on answering
# every search from a full scan at ~24s a query. Nothing surfaced the problem
# except timing the endpoint. The same disconnect is why auto-deploy does not
# fire (IMPROVEMENT_PLAN 5.5).
#
# The commands here were mirrored into the dashboard by hand on 2026-07-28 and
# match it as of then. Anything changed here must be changed there too, or it
# will silently have no effect. To remove the split, recreate the service from
# this Blueprint.
#
# The service also carries PYTHON_VERSION=3.14.3, set in the dashboard on
# 2026-08-02 and deliberately not listed under envVars below — a value here
# would read as authoritative while doing nothing. Before it was pinned the
# service took Render's rolling default, so the deployed interpreter could
# change under a redeploy with no commit to show for it. CI tests 3.14 to
# match; moving one without the other puts them back out of step.
services:
  - type: web
    name: lismore-da-mcp
    runtime: python
    plan: free
    # The search index is built at deploy time rather than on first request, so
    # that no user pays the ~8s extraction cost. It lands in the build's
    # filesystem, which the running instance keeps. If this step is ever skipped
    # the server still answers — search falls back to a full scan.
    buildCommand: pip install -r requirements.txt && PYTHONPATH=src python -m lismore_da_mcp.index
    startCommand: python -m lismore_da_mcp.server
    envVars:
      - key: MCP_TRANSPORT
        value: http
      - key: PYTHONPATH
        value: src
